        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        }

        function playTone(freq, duration, type = 'sine', volume = 0.12) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // ==================== VISUAIS ====================
        const flashEl = document.getElementById('flash');
        function flashScreen() {
            flashEl.classList.add('active');

        }

        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        const starsCanvas = document.getElementById('stars');
        const starsCtx = starsCanvas.getContext('2d');
        let confettiPieces = [], starPieces = [], confettiActive = false;

        function resizeCanvas() {
            canvas.width = starsCanvas.width = window.innerWidth;
            canvas.height = starsCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti(count = 90) {
            confettiPieces = [];
            const colors = ['#38bdf8','#818cf8','#c084fc','#34d399','#fbbf24','#f472b6','#22d3ee'];
            for (let i = 0; i < count; i++) {
                confettiPieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * -canvas.height,
                    w: Math.random() * 10 + 4,
                    h: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3.5 + 2.2,
                    angle: Math.random() * 360,
                    spin: Math.random() * 10 - 5,
                    opacity: 1
                });
            }
            starPieces = [];
            for (let i = 0; i < 35; i++) {
                starPieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.55,
                    size: Math.random() * 2.5 + 1,
                    speed: Math.random() * 1.3 + 0.4,
                    life: 1
                });
            }
            confettiActive = true;
            requestAnimationFrame(drawEffects);
        }

        function drawEffects() {
            if (!confettiActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            let alive = false;

            confettiPieces.forEach(p => {
                p.y += p.speed;
                p.x += Math.sin(p.angle * Math.PI / 180) * 1.5;
                p.angle += p.spin;
                p.opacity -= 0.008;
                if (p.opacity > 0 && p.y < canvas.height + 20) {
                    alive = true;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                    ctx.restore();
                }
            });

            starPieces.forEach(s => {
                s.y -= s.speed;
                s.life -= 0.013;
                if (s.life > 0) {
                    alive = true;
                    starsCtx.beginPath();
                    starsCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    starsCtx.fillStyle = `rgba(255,255,200,${s.life})`;
                    starsCtx.fill();
                }
            });

            if (alive) requestAnimationFrame(drawEffects);
            else {
                confettiActive = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            }
        }

        // ==================== LÓGICA ====================
        function obterNomeMototaxista() {

        function falar(texto) {
            if ('speechSynthesis' in window) {

                const msg = new SpeechSynthesisUtterance(texto);

                msg.rate = 1.05;

        const PONTO_LAT = -8.43982699740795;
        const PONTO_LNG = -35.01837120871769;
        const RAIO_METROS = 50;

        let tempoParado = null;

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

                document.getElementById('info-gps').innerText = 'Seu navegador não suporta GPS.';
                setStatus('erro-gps', 'Status: GPS não suportado');
                return;
            }

            navigator.geolocation.watchPosition((pos) => {
                avisoGpsFalado = false;
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const distancia = calcularDistancia(lat, lng, PONTO_LAT, PONTO_LNG);
                const info = document.getElementById('info-gps');
                info.innerHTML = `<div class="radar"></div>Distância do ponto: ${Math.round(distancia)}m`;

                if (distancia <= RAIO_METROS) {
                    info.className = 'info-gps perto';
                    if (estaNaFila) {
                        setStatus('na-fila', 'Status: Na Fila! 🔥');
                    } else if (!tempoParado) {
                        setStatus('aguardando', 'Detectado no ponto! Aguardando 20s...');
                        playNear();
                        vibrar([70, 40, 70, 40, 100]);
                        flashScreen();

                        const progressCont = document.getElementById('progress-container');
                        const progressBar = document.getElementById('progress-bar');
                        progressCont.style.display = 'block';
                        progressBar.style.width = '0%';
                        let progresso = 0;

                        countdownBeeps = setInterval(() => playCountdown(), 1000);

                        progressInterval = setInterval(() => {
                            progresso += 5; // 20s = 20 steps de 5%
                            progressBar.style.width = progresso + '%';
                            if (progresso >= 100) {
                                clearInterval(progressInterval);
                                clearInterval(countdownBeeps);
                            }
                        }, 1000);

                        tempoParado = setTimeout(() => {
                            entrarNaFila();
                            progressCont.style.display = 'none';
                            clearInterval(countdownBeeps);
                        }, TEMPO_ESPERA);
                    }
                } else {
                    info.className = 'info-gps longe';
                    if (tempoParado) {
                        clearTimeout(tempoParado);
                        tempoParado = null;
                        clearInterval(progressInterval);
                        clearInterval(countdownBeeps);
                        document.getElementById('progress-container').style.display = 'none';
                    }
                    if (estaNaFila) {
                        sairDaFila();
                    } else {
                        setStatus('fora', 'Status: Fora da fila');
                    }
                }
            }, (err) => {
                console.error(err);
                document.getElementById('info-gps').innerHTML = 'GPS desativado ou sem sinal!';
                document.getElementById('info-gps').className = 'info-gps longe';
                setStatus('erro-gps', 'Status: GPS Desligado/Sem Sinal!');
                if (!avisoGpsFalado) {
                    avisoGpsFalado = true;
                    vibrar([300, 150, 300]);
                    playWarning();
                    falar("Atenção, seu GPS foi desativado ou perdeu o sinal. Ative o GPS.");
                    showToast('⚠️ GPS perdido! Ative a localização', 'error');
                    flashScreen();
                }
                if (estaNaFila) sairDaFila();
            }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 6000 });
        }

        async function entrarNaFila() {
            const { data: existente } = await supabaseClient
                .from('fila')
                .select('nome')
                .eq('nome', nomeMototaxista);

            if (existente && existente.length > 0) {
                estaNaFila = true;
                setStatus('na-fila', 'Status: Na Fila! 🔥');
                return;
            }

            estaNaFila = true;
            setStatus('na-fila', 'Status: Na Fila! 🔥');

            playEnter();
            vibrar([100, 50, 100, 50, 200]);
            createConfetti(100);
            floatEmojis(['🚀','🔥','⚡','✨','🏍️'], 9);
            flashScreen();
            falar("Você entrou na fila do ponto! Boa sorte!");
            showToast('🚀 Você entrou na fila!', 'success');

            const { error } = await supabaseClient.from('fila').insert([{ nome: nomeMototaxista }]);
            if (error) console.error(error);
            carregarFila();
        }

        async function sairDaFila() {
            estaNaFila = false;
            tempoParado = null;
            jaCelebrouPrimeiro = false;
            document.getElementById('minha-posicao').classList.remove('show');
            document.getElementById('posicao-label').classList.remove('show');

            setStatus('fora', 'Status: Fora da fila / GPS ausente');
            playExit();
            vibrar(400);
            falar("Você saiu da fila.");
            showToast('Você saiu da fila', 'warn');

            const { error } = await supabaseClient.from('fila').delete().eq('nome', nomeMototaxista);
            if (error) console.error(error);
            carregarFila();
        }

        async function carregarFila() {
            const { data, error } = await supabaseClient
                .from('fila')
                .select('*')
                .order('criado_em', { ascending: true });

            const listaUl = document.getElementById('lista-fila');
            listaUl.innerHTML = '';

            if (error) {
                listaUl.innerHTML = '<li>Erro ao carregar a fila.</li>';
                return;
            }
            if (!data || data.length === 0) {
                listaUl.innerHTML = '<li style="justify-content:center;color:#94a3b8;">A fila está vazia 😴</li>';
                document.getElementById('minha-posicao').classList.remove('show');
                document.getElementById('posicao-label').classList.remove('show');
                return;
            }

            let minhaPos = null;
            data.forEach((moto, index) => {
                const li = document.createElement('li');
                li.style.animationDelay = (index * 0.05) + 's';
                if (index === 0) li.classList.add('primeiro');
                if (moto.nome === nomeMototaxista) {
                    li.classList.add('eu');
                    minhaPos = index + 1;
                }

                const dataChegada = moto.criado_em ? new Date(moto.criado_em) : new Date();
                const horaFormatada = dataChegada.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                li.innerHTML = `
                    <div class="moto-info">
                        <span class="moto-nome">\( {moto.nome} \){moto.nome === nomeMototaxista ? ' (você)' : ''}</span>
                        <span class="moto-hora">Chegada: ${horaFormatada}</span>
                    </div>
                    <span class="moto-posicao">${index + 1}º</span>
                `;
                listaUl.appendChild(li);
            });

            const posEl = document.getElementById('minha-posicao');
            const labelEl = document.getElementById('posicao-label');

            if (minhaPos !== null) {
                posEl.textContent = minhaPos + 'º';
                posEl.classList.add('show');
                labelEl.classList.add('show');

                // Celebração quando vira 1º
                if (minhaPos === 1 && !jaCelebrouPrimeiro) {
                    jaCelebrouPrimeiro = true;
                    playSuccess();
                    createConfetti(130);
                    floatEmojis(['👑','🏆','🔥','⚡','✨','🎉'], 12);
                    vibrar([180, 70, 180, 70, 180, 70, 350]);
                    flashScreen();
                    setTimeout(flashScreen, 180);
                    falar("Você é o próximo da vez! Prepare-se!");
                    showToast('👑 VOCÊ É O PRÓXIMO!', 'success');
                }

                // Celebração quando sobe de posição
                if (ultimaPosicao !== null && minhaPos < ultimaPosicao) {
                    playLevelUp();
                    showToast(`🔥 Subiu para ${minhaPos}º lugar!`, 'success');
                    vibrar([60, 30, 60, 30, 90]);
                    floatEmojis(['⬆️','🔥'], 4);
                }
                ultimaPosicao = minhaPos;
            } else {
                posEl.classList.remove('show');
                labelEl.classList.remove('show');
                ultimaPosicao = null;
                jaCelebrouPrimeiro = false;
            }
        }

        // ==================== INIT ====================
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        carregarFila();
        verificarSeJaEstaNaFila();
        iniciarGPS();

        supabaseClient
            .channel('public:fila')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'fila' }, () => carregarFila())
            .subscribe();

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                carregarFila();
                verificarSeJaEstaNaFila();
            }
        });
    </script>
</body>
</html>
