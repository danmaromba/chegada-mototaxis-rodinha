<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#004085">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Fila do Ponto de Mototáxis">
    <meta property="og:description" content="Acompanhe em tempo real a fila do ponto de mototáxis. Entre e saia automaticamente pelo GPS.">
    <meta property="og:site_name" content="Fila do Ponto">
    <!-- Substitua pela URL real da imagem quando tiver -->
    <meta property="og:image" content="https://seu-dominio.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- Twitter Card (opcional, mas recomendado) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fila do Ponto de Mototáxis">
    <meta name="twitter:description" content="Acompanhe em tempo real a fila do ponto de mototáxis. Entre e saia automaticamente pelo GPS.">
    
    <link rel="manifest" href="manifest.json">
    <title>Fila do Ponto de Mototáxis</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 22px; margin-bottom: 10px; color: #2c3e50; }
        .status { text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; }
        .status.na-fila { background-color: #d4edda; color: #155724; }
        .status.fora { background-color: #f8d7da; color: #721c24; }
        .status.aguardando { background-color: #fff3cd; color: #856404; }
        .status.erro-gps { background-color: #fce8e6; color: #c5221f; border: 1px dashed #c5221f; }
        h2 { font-size: 16px; margin-bottom: 10px; color: #555; }
        ul { list-style: none; }
        li { background: #e9ecef; padding: 10px 15px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        li.primeiro { background: #cce5ff; border-left: 5px solid #004085; font-weight: bold; }
        .moto-info { display: flex; flex-direction: column; }
        .moto-nome { font-size: 15px; font-weight: bold; color: #2c3e50; }
        .moto-hora { font-size: 12px; color: #666; margin-top: 2px; }
        .moto-posicao { font-size: 16px; font-weight: bold; color: #004085; }
        .info-gps { font-size: 12px; color: #666; text-align: center; margin-top: 15px; }
        .btn-trocar {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-trocar:hover { background: #5a6268; }
        #btn-instalar {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        #btn-instalar:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fila do Ponto 🏍️</h1>
        
        <div id="status-box" class="status fora">
            Status: Fora da fila
        </div>
        <h2>Próximos da vez:</h2>
        <ul id="lista-fila">
            <li>Carregando fila...</li>
        </ul>
        <div class="info-gps" id="info-gps">
            Aguardando sinal do GPS...
        </div>
        <button class="btn-trocar" onclick="trocarNome()">Alterar meu nome / apelido</button>
        <!-- Botão de instalação do PWA (no lugar correto, dentro do body) -->
        <button id="btn-instalar">
            📲 Instalar App no Celular
        </button>
    </div>
    <script>
        const SUPABASE_URL = 'https://etaiheynljzhzvpaqusm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DkBXJjtKJCBqjy2aNF8kFg_yKMK0hwg';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        function obterNomeMototaxista() {
            let nome = localStorage.getItem('mototaxi_nome');
            if (!nome || nome.trim() === "") {
                nome = prompt("Digite seu Nome ou Apelido:") || "Motoqueiro Anônimo";
                localStorage.setItem('mototaxi_nome', nome.trim());
            }
            return nome.trim();
        }
        async function trocarNome() {
            try {
                await supabaseClient.from('fila').delete().eq('nome', nomeMototaxista);
            } catch (err) {
                console.error('Erro ao remover nome antigo da fila:', err);
            } finally {
                localStorage.removeItem('mototaxi_nome');
                location.reload();
            }
        }
        const nomeMototaxista = obterNomeMototaxista();
        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensagem = new SpeechSynthesisUtterance(texto);
                mensagem.lang = 'pt-BR';
                mensagem.rate = 1.1;
                window.speechSynthesis.speak(mensagem);
            }
        }
        function vibrar(padrao) {
            if ('vibrate' in navigator) {
                try {
                    navigator.vibrate(padrao);
                } catch (e) {
                    console.error("Vibração bloqueada até interação do usuário", e);
                }
            }
        }
        const PONTO_LAT = -8.43982699740795; 
        const PONTO_LNG = -35.01837120871769;
        const RAIO_METROS = 50;
        let tempoParado = null;
        let estaNaFila = false;
        let avisoGpsFalado = false;
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        async function verificarSeJaEstaNaFila() {
            const { data, error } = await supabaseClient
                .from('fila')
                .select('nome')
                .eq('nome', nomeMototaxista);
            if (!error && data && data.length > 0) {
                estaNaFila = true;
                document.getElementById('status-box').className = 'status na-fila';
                document.getElementById('status-box').innerText = 'Status: Na Fila!';
            }
        }
        function iniciarGPS() {
            if (!navigator.geolocation) {
                document.getElementById('info-gps').innerText = 'Seu navegador não suporta GPS.';
                document.getElementById('status-box').className = 'status erro-gps';
                document.getElementById('status-box').innerText = 'Status: GPS não suportado';
                falar("Seu navegador não suporta localização GPS.");
                return;
            }
            navigator.geolocation.watchPosition((pos) => {
                avisoGpsFalado = false;
                
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const distancia = calcularDistancia(lat, lng, PONTO_LAT, PONTO_LNG);
                document.getElementById('info-gps').innerText = `Distância do ponto: ${Math.round(distancia)}m`;
                if (distancia <= RAIO_METROS) {
                    if (!estaNaFila && !tempoParado) {
                        document.getElementById('status-box').className = 'status aguardando';
                        document.getElementById('status-box').innerText = 'Status: Detectado no ponto. Aguardando 20s...';
                        
                        tempoParado = setTimeout(() => {
                            entrarNaFila();
                        }, 20000);
                    }
                } else {
                    if (tempoParado) {
                        clearTimeout(tempoParado);
                        tempoParado = null;
                    }
                    if (estaNaFila) {
                        sairDaFila();
                    } else {
                        document.getElementById('status-box').className = 'status fora';
                        document.getElementById('status-box').innerText = 'Status: Fora da fila';
                    }
                }
            }, (err) => {
                console.error(err);
                document.getElementById('info-gps').innerText = 'GPS desativado ou sem sinal!';
                document.getElementById('status-box').className = 'status erro-gps';
                document.getElementById('status-box').innerText = 'Status: GPS Desligado/Sem Sinal!';
                if (!avisoGpsFalado) {
                    avisoGpsFalado = true;
                    vibrar([400, 200, 400]);
                    falar("Atenção, seu GPS foi desativado ou perdeu o sinal. Ative o GPS.");
                }
                if (estaNaFila) {
                    sairDaFila();
                }
            }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 8000 });
        }
        async function entrarNaFila() {
            // Checa novamente antes de inserir para evitar duplicidade
            const { data: existente } = await supabaseClient
                .from('fila')
                .select('nome')
                .eq('nome', nomeMototaxista);
            if (existente && existente.length > 0) {
                estaNaFila = true;
                document.getElementById('status-box').className = 'status na-fila';
                document.getElementById('status-box').innerText = 'Status: Na Fila!';
                return;
            }
            estaNaFila = true;
            document.getElementById('status-box').className = 'status na-fila';
            document.getElementById('status-box').innerText = 'Status: Na Fila!';
            vibrar([300, 100, 300]);
            falar("Você entrou na fila do ponto.");
            const { error } = await supabaseClient.from('fila').insert([
                { nome: nomeMototaxista }
            ]);
            if (error) {
                console.error('Erro ao inserir:', error);
            }
            carregarFila();
        }
        async function sairDaFila() {
            estaNaFila = false;
            tempoParado = null;
            document.getElementById('status-box').className = 'status fora';
            document.getElementById('status-box').innerText = 'Status: Fora da fila / GPS ausente';
            vibrar(500);
            falar("Você saiu da fila.");
            const { error } = await supabaseClient.from('fila').delete().eq('nome', nomeMototaxista);
            
            if (error) {
                console.error('Erro ao deletar:', error);
            }
            carregarFila();
        }
        async function carregarFila() {
            const { data, error } = await supabaseClient
                .from('fila')
                .select('*')
                .order('criado_em', { ascending: true });
            const listaUl = document.getElementById('lista-fila');
            listaUl.innerHTML = '';
            if (error) {
                console.error('Erro ao buscar fila:', error);
                listaUl.innerHTML = '<li>Erro ao carregar a fila do banco.</li>';
                return;
            }
            if (!data || data.length === 0) {
                listaUl.innerHTML = '<li>A fila está vazia.</li>';
                return;
            }
            data.forEach((moto, index) => {
                const li = document.createElement('li');
                if (index === 0) li.classList.add('primeiro');
                const dataChegada = moto.criado_em ? new Date(moto.criado_em) : new Date();
                const horaFormatada = dataChegada.toLocaleTimeString('pt-BR');
                li.innerHTML = `
                    <div class="moto-info">
                        <span class="moto-nome">${moto.nome}</span>
                        <span class="moto-hora">Chegada: ${horaFormatada}</span>
                    </div>
                    <span class="moto-posicao">${index + 1}º</span>
                `;
                listaUl.appendChild(li);
            });
        }
        // ========== INICIALIZAÇÃO ==========
        carregarFila();
        verificarSeJaEstaNaFila();
        iniciarGPS();
        
        // Atualiza a fila em tempo real via WebSocket do Supabase
        supabaseClient
            .channel('public:fila')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'fila' }, () => {
                carregarFila();
            })
            .subscribe();
        // Garante atualização quando o app volta do segundo plano
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                carregarFila();
                verificarSeJaEstaNaFila();
            }
        });
        // ========== SERVICE WORKER (PWA) ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('Service Worker registrado com sucesso:', reg.scope);
                    })
                    .catch((err) => {
                        console.error('Falha ao registrar Service Worker:', err);
                    });
            });
        }
        // ========== INSTALAÇÃO DO PWA ==========
        let deferredPrompt;
        const btnInstalar = document.getElementById('btn-instalar');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalar.style.display = 'block';
        });
        btnInstalar.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('Usuário aceitou instalar o app');
            }
            deferredPrompt = null;
            btnInstalar.style.display = 'none';
        });
        window.addEventListener('appinstalled', () => {
            console.log('Aplicativo instalado com sucesso!');
            btnInstalar.style.display = 'none';
        });
    </script>
</body>
</html>
