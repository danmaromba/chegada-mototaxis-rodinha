/* =========================================================
   ÁUDIO
========================================================= */

function initAudio() {

    try {

        if (!audioCtx) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) return;

            audioCtx = new AudioContext();
        }

        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }

    } catch (erro) {

        console.warn('Áudio indisponível:', erro);

    }
}


function playTone(
    freq,
    duration,
    type = 'sine',
    volume = 0.12,
    detune = 0
) {

    if (!audioCtx) return;

    try {

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = type;
        osc.frequency.value = freq;
        osc.detune.value = detune;

        const agora = audioCtx.currentTime;

        gain.gain.setValueAtTime(
            volume,
            agora
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            agora + duration
        );

        osc.start(agora);

        osc.stop(agora + duration);

    } catch (erro) {

        console.warn('Erro de áudio:', erro);

    }
}


function playNoise(duration, volume = 0.08) {

    if (!audioCtx) return;

    try {

        const bufferSize =
            Math.floor(audioCtx.sampleRate * duration);

        const buffer =
            audioCtx.createBuffer(
                1,
                bufferSize,
                audioCtx.sampleRate
            );

        const data =
            buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            data[i] =
                Math.random() * 2 - 1;
        }

        const noise =
            audioCtx.createBufferSource();

        const gain =
            audioCtx.createGain();

        const filter =
            audioCtx.createBiquadFilter();

        filter.type = 'lowpass';
        filter.frequency.value = 1200;

        noise.buffer = buffer;

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        const agora = audioCtx.currentTime;

        gain.gain.setValueAtTime(
            volume,
            agora
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            agora + duration
        );

        noise.start();

    } catch (erro) {

        console.warn('Erro no ruído:', erro);

    }
}

function startAmbient() {

    initAudio();

    if (!audioCtx || ambientOsc) return;

    try {

        ambientOsc =
            audioCtx.createOscillator();

        ambientGain =
            audioCtx.createGain();

        ambientOsc.type = 'sine';

        ambientOsc.frequency.value = 110;

        ambientGain.gain.value = 0.015;

        ambientOsc.connect(ambientGain);

        ambientGain.connect(
            audioCtx.destination
        );

        ambientOsc.start();

    } catch (erro) {

        console.warn(
            'Erro no áudio ambiente:',
            erro
        );

        ambientOsc = null;
        ambientGain = null;
    }
}


function stopAmbient() {

    if (!ambientOsc || !audioCtx) return;

    try {

        ambientGain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.5
        );

        const osc = ambientOsc;

        setTimeout(() => {

            try {
                osc.stop();
            } catch (e) {}

        }, 600);

    } catch (erro) {}

    ambientOsc = null;
    ambientGain = null;
}

let starPieces = [];

function createConfetti(count = 100) {

    confettiPieces = [];

    const colors = [
        '#38bdf8',
        '#818cf8',
        '#c084fc',
        '#34d399',
        '#fbbf24',
        '#f472b6',
        '#fb7185',
        '#22d3ee'
    ];

    for (let i = 0; i < count; i++) {

        confettiPieces.push({

            x:
                Math.random() *
                canvas.width,

            y:
                Math.random() *
                -canvas.height,

            w:
                Math.random() * 11 + 4,

            h:
                Math.random() * 7 + 3,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ],

            speed:
                Math.random() * 4 + 2.5,

            angle:
                Math.random() * 360,

            spin:
                Math.random() * 12 - 6,

            opacity: 1
        });
    }

    starPieces = [];

    for (let i = 0; i < 40; i++) {

        starPieces.push({

            x:
                Math.random() *
                canvas.width,

            y:
                Math.random() *
                canvas.height *
                0.6,

            size:
                Math.random() * 3 + 1,

            speed:
                Math.random() * 1.5 + 0.5,

            life: 1
        });
    }

    confettiActive = true;

    requestAnimationFrame(
        drawEffects
    );
}


function drawEffects() {

    if (!confettiActive) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    starsCtx.clearRect(
        0,
        0,
        starsCanvas.width,
        starsCanvas.height
    );

    let alive = false;

    confettiPieces.forEach(p => {

        p.y += p.speed;

        p.x +=
            Math.sin(
                p.angle * Math.PI / 180
            ) * 1.8;

        p.angle += p.spin;

        p.opacity -= 0.007;

        if (
            p.opacity > 0 &&
            p.y < canvas.height + 30
        ) {

            alive = true;

            ctx.save();

            ctx.translate(
                p.x,
                p.y
            );

            ctx.rotate(
                p.angle *
                Math.PI /
                180
            );

            ctx.globalAlpha =
                p.opacity;

            ctx.fillStyle =
                p.color;

            ctx.fillRect(
                -p.w / 2,
                -p.h / 2,
                p.w,
                p.h
            );

            ctx.restore();
        }
    });


    starPieces.forEach(s => {

        s.y -= s.speed;

        s.life -= 0.012;

        if (s.life > 0) {

            alive = true;

            starsCtx.beginPath();

            starsCtx.arc(
                s.x,
                s.y,
                s.size,
                0,
                Math.PI * 2
            );

            starsCtx.fillStyle =
                `rgba(255,255,200,${s.life})`;

            starsCtx.fill();
        }
    });


    if (alive) {

        requestAnimationFrame(
            drawEffects
        );

    } else {

        confettiActive = false;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        starsCtx.clearRect(
            0,
            0,
            starsCanvas.width,
            starsCanvas.height
        );
    }
}

/* =========================================================
   DISTÂNCIA GPS
========================================================= */

function calcularDistancia(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371e3;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}

/* =========================================================
   ENTRAR NA FILA
========================================================= */

async function entrarNaFila() {

    cancelarEntrada();

    if (estaNaFila) {
        return;
    }

    /*
     * Primeiro verifica novamente no banco.
     * Isso evita duplicação caso outro processo
     * tenha colocado o mesmo nome na fila.
     */

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('fila')
                .select('nome')
                .eq(
                    'nome',
                    nomeMototaxista
                )
                .limit(1);

        if (error) {

            console.error(
                'Erro verificando duplicidade:',
                error
            );

            return;
        }

        if (data && data.length > 0) {

            estaNaFila = true;

            setStatus(
                'na-fila',
                'Status: Na Fila! 🔥'
            );

            startAmbient();

            return;
        }

    } catch (erro) {

        console.error(erro);

        return;
    }


    /*
     * Insere no banco.
     */

    const {
        error: insertError
    } =
        await supabaseClient
            .from('fila')
            .insert([
                {
                    nome:
                        nomeMototaxista
                }
            ]);


    /*
     * Só consideramos o motorista realmente
     * dentro da fila depois que o Supabase
     * confirmou a inserção.
     */

    if (insertError) {

        console.error(
            'Erro ao entrar na fila:',
            insertError
        );

        setStatus(
            'erro-gps',
            'Erro ao entrar na fila'
        );

        showToast(
            '❌ Não foi possível entrar na fila.',
            'error'
        );

        return;
    }


    estaNaFila = true;

    setStatus(
        'na-fila',
        'Status: Na Fila! 🔥'
    );

    playEnter();

    vibrar([
        100,
        50,
        100,
        50,
        100,
        50,
        250
    ]);

    createConfetti(110);

    floatEmojis(
        [
            '🚀',
            '🔥',
            '⚡',
            '✨',
            '🏍️'
        ],
        10
    );

    flashScreen();

    falar(
        'Você entrou na fila do ponto! Boa sorte!'
    );

    showToast(
        '🚀 Você entrou na fila!',
        'success'
    );

    startAmbient();

    carregarFila();
}

async function sairDaFila() {

    /*

    if (!estaNaFila) {

    } =

            );


    if (error) {

        console.error(

        );

        /*

    );

/* =========================================================
   CARREGAR FILA
========================================================= */

async function carregarFila() {

    /*
     * Evita várias consultas simultâneas.
     */

    if (carregandoFila) {
        return;
    }

    carregandoFila = true;

    const listaUl =
        document.getElementById(
            'lista-fila'
        );

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('fila')
                .select('*')
                .order(
                    'criado_em',
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                'Erro carregando fila:',
                error
            );

            listaUl.innerHTML = '';

            const li =
                document.createElement('li');

            li.textContent =
                'Erro ao carregar a fila.';

            listaUl.appendChild(li);

            return;
        }


        listaUl.innerHTML = '';


        if (
            !data ||
            data.length === 0
        ) {

            const li =
                document.createElement('li');

            li.style.justifyContent =
                'center';

            li.style.color =
                '#94a3b8';

            li.textContent =
                'A fila está vazia 😴';

            listaUl.appendChild(li);

            document
                .getElementById(
                    'minha-posicao'
                )
                .classList.remove('show');

            document
                .getElementById(
                    'posicao-label'
                )
                .classList.remove('show');

            ultimaPosicao = null;

            jaCelebrouPrimeiro = false;

            return;
        }


        let minhaPos = null;


        data.forEach(
            (moto, index) => {

                const li =
                    document.createElement('li');

                li.style.animationDelay =
                    (index * 0.06) +
                    's';


                if (index === 0) {

                    li.classList.add(
                        'primeiro'
                    );
                }


                const souEu =
                    moto.nome ===
                    nomeMototaxista;


                if (souEu) {

                    li.classList.add(
                        'eu'
                    );

                    minhaPos =
                        index + 1;
                }


                /*
                 * IMPORTANTE:
                 * não usamos innerHTML com o nome
                 * vindo diretamente do banco.
                 *
                 * Isso evita que um nome como
                 * <img onerror=...> seja interpretado
                 * como HTML.
                 */

                const info =
                    document.createElement('div');

                info.className =
                    'moto-info';


                const nomeEl =
                    document.createElement('span');

                nomeEl.className =
                    'moto-nome';

                nomeEl.textContent =
                    moto.nome +
                    (souEu ? ' (você)' : '');


                const horaEl =
                    document.createElement('span');

                horaEl.className =
                    'moto-hora';


                let dataChegada;

                if (moto.criado_em) {

                    dataChegada =
                        new Date(
                            moto.criado_em
                        );

                } else {

                    dataChegada =
                        new Date();
                }


                const horaFormatada =
                    dataChegada.toLocaleTimeString(
                        'pt-BR',
                        {
                            hour: '2-digit',
                            minute: '2-digit'
                        }
                    );


                horaEl.textContent =
                    'Chegada: ' +
                    horaFormatada;


                info.appendChild(
                    nomeEl
                );

                info.appendChild(
                    horaEl
                );


                const pos =
                    document.createElement('span');

                pos.className =
                    'moto-posicao';

                pos.textContent =
                    (index + 1) + 'º';


                li.appendChild(
                    info
                );

                li.appendChild(
                    pos
                );


                listaUl.appendChild(
                    li
                );
            }
        );


        /*
         * Atualiza posição do usuário.
         */

        const posEl =
            document.getElementById(
                'minha-posicao'
            );

        const labelEl =
            document.getElementById(
                'posicao-label'
            );


        if (minhaPos !== null) {

            posEl.textContent =
                minhaPos + 'º';

            posEl.classList.add(
                'show'
            );

            labelEl.classList.add(
                'show'
            );


            /*
             * Chegou em primeiro lugar.
             */

            if (
                minhaPos === 1 &&
                !jaCelebrouPrimeiro
            ) {

                jaCelebrouPrimeiro = true;

                playSuccess();

                createConfetti(140);

                floatEmojis(
                    [
                        '👑',
                        '🏆',
                        '🔥',
                        '⚡',
                        '✨',
                        '🎉'
                    ],
                    14
                );

                vibrar([
                    200,
                    80,
                    200,
                    80,
                    200,
                    80,
                    400
                ]);

                flashScreen();

                setTimeout(
                    flashScreen,
                    200
                );

                falar(
                    'Você é o próximo da vez! Prepare-se!'
                );

                showToast(
                    '👑 VOCÊ É O PRÓXIMO!',
                    'success'
                );
            }


            /*
             * Subiu de posição.
             */

            if (
                ultimaPosicao !== null &&
                minhaPos < ultimaPosicao
            ) {

                playLevelUp();

                showToast(
                    `🔥 Subiu para ${minhaPos}º lugar!`,
                    'success'
                );

                vibrar([
                    70,
                    40,
                    70,
                    40,
                    100
                ]);

                floatEmojis(
                    [
                        '⬆️',
                        '🔥'
                    ],
                    4
                );
            }


            ultimaPosicao =
                minhaPos;


        } else {

            posEl.classList.remove(
                'show'
            );

            labelEl.classList.remove(
                'show'
            );

            ultimaPosicao = null;

            jaCelebrouPrimeiro = false;
        }


    } catch (erro) {

        console.error(
            'Erro inesperado ao carregar fila:',
            erro
        );

    } finally {

        carregandoFila = false;
    }
}


/* =========================================================
   INICIAR GPS
========================================================= */

function iniciarGPS() {

    if (!navigator.geolocation) {

        document
            .getElementById(
                'info-gps'
            )
            .textContent =
            'Seu navegador não suporta GPS.';

        setStatus(
            'erro-gps',
            'Status: GPS não suportado'
        );

        falar(
            'Seu navegador não suporta localização GPS.'
        );

        return;
    }


    /*
     * Evita criar dois watchPosition.
     */

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );
    }


    watchId =
        navigator.geolocation.watchPosition(

            /* ==========================
               SUCESSO
            ========================== */

            async (pos) => {

                avisoGpsFalado = false;

                ultimoGpsOk =
                    Date.now();


                const lat =
                    pos.coords.latitude;

                const lng =
                    pos.coords.longitude;


                const distancia =
                    calcularDistancia(
                        lat,
                        lng,
                        PONTO_LAT,
                        PONTO_LNG
                    );


                const info =
                    document.getElementById(
                        'info-gps'
                    );


                /*
                 * Recria o radar de forma segura.
                 */

                info.innerHTML = '';

                const radar =
                    document.createElement(
                        'div'
                    );

                radar.className =
                    'radar';

                info.appendChild(
                    radar
                );


                const texto =
                    document.createTextNode(
                        'Distância do ponto: ' +
                        Math.round(distancia) +
                        'm'
                    );

                info.appendChild(
                    texto
                );


                /* ==========================
                   DENTRO DO RAIO
                ========================== */

                if (
                    distancia <=
                    RAIO_METROS
                ) {

                    info.className =
                        'info-gps perto';


                    /*
                     * Se voltou para o ponto,
                     * cancela imediatamente o
                     * timer de saída.
                     */

                    if (timerSaida) {

                        cancelarTimerSaida(
                            true
                        );

                        if (estaNaFila) {

                            setStatus(
                                'na-fila',
                                'Status: Na Fila! 🔥'
                            );
                        }
                    }


                    /*
                     * Já está na fila.
                     */

                    if (estaNaFila) {

                        setStatus(
                            'na-fila',
                            'Status: Na Fila! 🔥'
                        );

                        return;
                    }


                    /*
                     * Ainda não começou o
                     * processo de entrada.
                     */

                    if (!tempoParado) {

                        setStatus(
                            'aguardando',
                            'Detectado no ponto! Aguardando 5s...'
                        );

                        playNear();

                        vibrar([
                            80,
                            40,
                            80,
                            40,
                            120
                        ]);

                        flashScreen();


                        const progressCont =
                            document.getElementById(
                                'progress-container'
                            );

                        const progressBar =
                            document.getElementById(
                                'progress-bar'
                            );


                        progressCont.style.display =
                            'block';

                        progressBar.style.width =
                            '0%';


                        let inicio =
                            Date.now();


                        countdownBeeps =
                            setInterval(
                                () => {
                                    playCountdown();
                                },
                                1000
                            );


                        progressInterval =
                            setInterval(
                                () => {

                                    const decorrido =
                                        Date.now() -
                                        inicio;

                                    const porcentagem =
                                        Math.min(
                                            100,
                                            (
                                                decorrido /
                                                TEMPO_ENTRADA_MS
                                            ) * 100
                                        );

                                    progressBar.style.width =
                                        porcentagem +
                                        '%';

                                },
                                100
                            );


                        tempoParado =
                            setTimeout(
                                async () => {

                                    tempoParado =
                                        null;

                                    clearInterval(
                                        progressInterval
                                    );

                                    clearInterval(
                                        countdownBeeps
                                    );

                                    progressInterval =
                                        null;

                                    countdownBeeps =
                                        null;

                                    progressCont.style.display =
                                        'none';

                                    await entrarNaFila();

                                },
                                TEMPO_ENTRADA_MS
                            );
                    }


                /* ==========================
                   FORA DO RAIO
                ========================== */

                } else {

                    info.className =
                        'info-gps longe';


                    /*
                     * Cancelar entrada em andamento.
                     */

                    if (tempoParado) {

                        cancelarEntrada();

                        setStatus(
                            'fora',
                            'Status: Fora da fila'
                        );
                    }


                    /*
                     * Se está na fila,
                     * começa tolerância de 15s.
                     */

                    if (
                        estaNaFila &&
                        !timerSaida
                    ) {

                        setStatus(
                            'aguardando',
                            'Fora do raio! Saindo em 15s...'
                        );

                        showToast(
                            '⚠️ Você saiu do raio! Retirada em 15s...',
                            'warn'
                        );


                        timerSaida =
                            setTimeout(
                                async () => {

                                    timerSaida =
                                        null;

                                    /*
                                     * Antes de remover,
                                     * fazemos uma nova leitura
                                     * GPS para reduzir falsos
                                     * positivos.
                                     */

                                    if (
                                        navigator.geolocation
                                    ) {

                                        navigator.geolocation.getCurrentPosition(

                                            async novaPos => {

                                                const novaDistancia =
                                                    calcularDistancia(
                                                        novaPos.coords.latitude,
                                                        novaPos.coords.longitude,
                                                        PONTO_LAT,
                                                        PONTO_LNG
                                                    );

                                                if (
                                                    novaDistancia <=
                                                    RAIO_METROS
                                                ) {

                                                    showToast(
                                                        '🔄 Você ainda está no ponto.',
                                                        'success'
                                                    );

                                                    setStatus(
                                                        'na-fila',
                                                        'Status: Na Fila! 🔥'
                                                    );

                                                    return;
                                                }

                                                await sairDaFila();

                                            },

                                            async () => {

                                                /*
                                                 * Se não conseguimos
                                                 * nova posição, mantém
                                                 * o comportamento original.
                                                 */

                                                await sairDaFila();
                                            },

                                            {
                                                enableHighAccuracy: true,
                                                maximumAge: 0,
                                                timeout: 7000
                                            }
                                        );

                                    } else {

                                        await sairDaFila();
                                    }

                                },
                                TEMPO_TOLERANCIA_SAIDA_MS
                            );
                    }


                    if (
                        !estaNaFila &&
                        !timerSaida &&
                        !tempoParado
                    ) {

                        setStatus(
                            'fora',
                            'Status: Fora da fila'
                        );
                    }
                }
            },


            /* ==========================
               ERRO GPS
            ========================== */

            (err) => {

                console.error(
                    'Erro GPS:',
                    err
                );


                const info =
                    document.getElementById(
                        'info-gps'
                    );

                info.innerHTML =
                    '<div class="radar"></div>' +
                    'GPS desativado ou sem sinal!';

                info.className =
                    'info-gps longe';


                setStatus(
                    'erro-gps',
                    'Status: GPS Desligado/Sem Sinal!'
                );


                if (!avisoGpsFalado) {

                    avisoGpsFalado = true;

                    vibrar([
                        300,
                        150,
                        300,
                        150,
                        400
                    ]);

                    playWarning();

                    falar(
                        'Atenção, seu GPS perdeu o sinal. Tentando reconectar.'
                    );

                    showToast(
                        '⚠️ GPS perdido! Tentando reconectar...',
                        'error'
                    );

                    flashScreen();
                }


                /*
                 * Não removemos imediatamente.
                 * Damos os 15 segundos de tolerância.
                 */

                if (
                    estaNaFila &&
                    !timerSaida
                ) {

                    setStatus(
                        'aguardando',
                        'Sem sinal GPS! Saindo em 15s...'
                    );


                    timerSaida =
                        setTimeout(
                            async () => {

                                timerSaida =
                                    null;

                                await sairDaFila();

                            },
                            TEMPO_TOLERANCIA_SAIDA_MS
                        );
                }
            },


            {
                enableHighAccuracy: true,
                maximumAge: 3000,
                timeout: 8000
            }
        );
}


/* =========================================================
   AUDIO APÓS PRIMEIRO TOQUE
========================================================= */

document.body.addEventListener(
    'click',
    initAudio,
    {
        once: true
    }
);

document.body.addEventListener(
    'touchstart',
    initAudio,
    {
        once: true
    }
);


/* =========================================================
   SUPABASE REALTIME
========================================================= */

let canalFila = null;

try {

    canalFila =
        supabaseClient
            .channel(
                'fila-mototaxi-tempo-real'
            )
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'fila'
                },
                () => {

                    carregarFila();

                    /*
                     * Também verifica se
                     * o próprio usuário foi
                     * removido/adicionado.
                     */

                    verificarSeJaEstaNaFila();
                }
            )
            .subscribe(
                status => {

                    console.log(
                        'Realtime:',
                        status
                    );
                }
            );

} catch (erro) {

    console.error(
        'Erro no Realtime:',
        erro
    );
}


/* =========================================================
   VOLTAR PARA O APP
========================================================= */

document.addEventListener(
    'visibilitychange',
    () => {

        if (
            document.visibilityState ===
            'visible'
        ) {

            carregarFila();

            verificarSeJaEstaNaFila();

            /*
             * Se ficou muito tempo em segundo plano,
             * reinicia o GPS.
             */

            if (
                Date.now() -
                ultimoGpsOk >
                15000
            ) {

                iniciarGPS();
            }
        }
    }
);


/* =========================================================
   SERVICE WORKER / PWA
========================================================= */

if (
    'serviceWorker' in navigator
) {

    window.addEventListener(
        'load',
        () => {

            navigator.serviceWorker
                .register('./sw.js')
                .then(
                    reg => {

                        console.log(
                            'Service Worker OK:',
                            reg.scope
                        );

                    }
                )
                .catch(
                    err => {

                        console.error(
                            'Service Worker falhou:',
                            err
                        );

                    }
                );
        }
    );
}


/* =========================================================
   INSTALAÇÃO PWA
========================================================= */

const btnInstalar =
    document.getElementById(
        'btn-instalar'
    );


window.addEventListener(
    'beforeinstallprompt',
    e => {

        e.preventDefault();

        deferredPrompt = e;

        btnInstalar.style.display =
            'block';
    }
);


btnInstalar.addEventListener(
    'click',
    async () => {

        playClick();

        if (!deferredPrompt) {

            showToast(
                '📲 A instalação não está disponível agora.',
                'warn'
            );

            return;
        }


        try {

            deferredPrompt.prompt();

            const {
                outcome
            } =
                await deferredPrompt.userChoice;


            if (
                outcome ===
                'accepted'
            ) {

                playSuccess();

                createConfetti(70);

                showToast(
                    '🎉 App instalado com sucesso!',
                    'success'
                );
            }

        } catch (erro) {

            console.error(
                'Erro instalando PWA:',
                erro
            );

        } finally {

            deferredPrompt = null;

            btnInstalar.style.display =
                'none';
        }
    }
);


window.addEventListener(
    'appinstalled',
    () => {

        btnInstalar.style.display =
            'none';

        createConfetti(80);

        floatEmojis(
            [
                '📲',
                '🎉',
                '✨'
            ],
            6
        );
    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

(async function iniciarAplicacao() {

    console.log(
        'Fila do Ponto iniciando...'
    );

    console.log(
        'Mototaxista:',
        nomeMototaxista
    );

    await verificarSeJaEstaNaFila();

    await carregarFila();

    iniciarGPS();

})();
</script>
